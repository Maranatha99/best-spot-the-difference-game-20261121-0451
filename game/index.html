<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temukan Perbedaan — Pasar Malam &amp; Taman Senja</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101d; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, 177.78vh); height: auto; aspect-ratio: 1280 / 720;
    display: block; touch-action: none; cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Temukan Perbedaan: dua gambar nyaris sama berdampingan, klik perbedaannya"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
